plugins {
    id 'com.android.application'
}

android {
    namespace 'org.comicreader.app'
    compileSdk 37
    defaultConfig {
        applicationId 'org.comicreader.app'
        minSdk 28
        targetSdk 36
        versionCode 13
        versionName '0.8.0'
        testInstrumentationRunner 'org.comicreader.app.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    sourceSets.androidTest.java.srcDir('src/nativeTest/java')
    sourceSets.androidTest.assets.srcDir('src/test/resources')
    testOptions {
        unitTests.includeAndroidResources = true
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation project(':mega-sdk')
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.github.junrar:junrar:8.1.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
